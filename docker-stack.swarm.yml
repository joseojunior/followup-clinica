version: "3.8"

x-followup-environment: &followup-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  SOURCE_USUARIOS_SDR_DATABASE_URL: ${SOURCE_USUARIOS_SDR_DATABASE_URL}
  SOURCE_CLINICA_NOVA_DATABASE_URL: ${SOURCE_CLINICA_NOVA_DATABASE_URL}
  WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL}
  WHATSAPP_SENDER_1_TOKEN: ${WHATSAPP_SENDER_1_TOKEN}
  WHATSAPP_SENDER_2_TOKEN: ${WHATSAPP_SENDER_2_TOKEN}
  FOLLOWUP_SEND_MODE: ${FOLLOWUP_SEND_MODE:-dry_run}
  WORKER_API_KEY: ${WORKER_API_KEY}
  UAZAPI_WEBHOOK_SECRET: ${UAZAPI_WEBHOOK_SECRET}
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
  WORKER_POLL_MS: ${WORKER_POLL_MS:-30000}
  WORKER_ENROLL_INTERVAL_MS: ${WORKER_ENROLL_INTERVAL_MS:-300000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_SETTINGS_ENCRYPTION_KEY: ${AI_SETTINGS_ENCRYPTION_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}

services:
  followup_migrate:
    image: ${FOLLOWUP_IMAGE}
    networks:
      - LeticiaAtdNet
    environment:
      <<: *followup-environment
      APP_ROLE: migrate
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.role == manager

  followup_web:
    image: ${FOLLOWUP_IMAGE}
    networks:
      - LeticiaAtdNet
    environment:
      <<: *followup-environment
      APP_ROLE: web
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.http.routers.followup-panel.rule=Host(`${FOLLOWUP_APP_HOST:-app.leticiaatd.online}`)
        - traefik.http.routers.followup-panel.entrypoints=websecure
        - traefik.http.routers.followup-panel.tls.certresolver=letsencryptresolver
        - traefik.http.routers.followup-panel.service=followup-web
        - traefik.http.routers.followup-api.rule=Host(`${FOLLOWUP_API_HOST:-followapi.leticiaatd.online}`) && PathPrefix(`/api`)
        - traefik.http.routers.followup-api.entrypoints=websecure
        - traefik.http.routers.followup-api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.followup-api.service=followup-web
        - traefik.http.services.followup-web.loadbalancer.server.port=3000
        - traefik.http.services.followup-web.loadbalancer.passHostHeader=1

  followup_worker:
    image: ${FOLLOWUP_IMAGE}
    networks:
      - LeticiaAtdNet
    environment:
      <<: *followup-environment
      APP_ROLE: worker
      FOLLOWUP_APP_URL: http://followup_web:3000
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  LeticiaAtdNet:
    external: true
    name: LeticiaAtdNet
